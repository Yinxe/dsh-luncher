[package]
name = "dsh-starter"
version = "0.3.1"
description = "Cross-platform launcher for @deepseek-ai/dsh"
authors = ["you"]
edition = "2021"

[lib]
name = "dsh_starter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 生产构建启用此 feature 后使用内嵌前端资源（否则 debug/dev 模式加载 devUrl）
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# 单实例守卫：重复启动（再次双击图标/快捷方式）不再起第二个启动器进程与托盘图标，
# 而是把「有人又点了一次」转交给已运行实例，新进程随即退出
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order：模型配置的 headers / compat / reasoningEfforts 等映射字段
# 读写往返时保持原有键序（IndexMap）
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
# 内置 Node 归档的完整性校验（runtime.rs 边下边算 SHA-256，与官方锚定值比对）
sha2 = "0.10"
# 跨平台「端口 → 占用进程」查询：Linux 读 /proc（rustix）、macOS 走 libproc、
# Windows 走 IP Helper。纯 Rust 依赖、无 build.rs；刻意不用 netstat2 0.10+，
# 因为它会在 Linux/macOS 引入 bindgen 构建依赖（要求装 libclang）。
listeners = "0.6"
# pnpm 失败分类用（dshmarket 的 pnpm-compat 思路；锁定文件里已有 1.13）
regex = "1"
# 会话统计：dsh 的会话日志是 zstd 压缩 JSONL（sessions/session(.v3).jsonl.zstd）
zstd = "0.13"
# 会话统计的本地时区日/小时分桶与连续天数计算
chrono = "0.4"

[dev-dependencies]
# mock_app：给插件任务运行器做「真起进程 + 真流式事件」的集成测试
tauri = { version = "2", features = ["test"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 16
strip = true

# dev 构建的调试信息等级：默认 2（全量 DWARF）会让单个 Tauri 调试二进制到 330 MB 以上，
# target/ 轻易滚到几十 GB。降到 1 保留行号与函数级信息，体积约减半。
# 需要逐变量调试时临时改回 2（会触发全量重编）。
[profile.dev]
debug = 1
