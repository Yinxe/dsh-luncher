[package]
name = "dsh-launcher"
version = "0.1.0"
description = "Cross-platform launcher for @deepseek-ai/dsh"
authors = ["you"]
edition = "2021"

[lib]
name = "dsh_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 生产构建启用此 feature 后使用内嵌前端资源（否则 debug/dev 模式加载 devUrl）
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order：模型配置的 headers / compat / reasoningEfforts 等映射字段
# 读写往返时保持原有键序（IndexMap）
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 16
strip = true
