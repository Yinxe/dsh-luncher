name: 发布

# 官方模板：https://v2.tauri.app/distribute/pipelines/github
# 只改了三处，都在代码里标了 ★：
#   ★1 触发方式：push 到 main（平时在 dev 开发，合进 main 即发版）+ 手动触发
#   ★2 注入签名密钥：否则产物没有 .sig、也不会生成 latest.json
#   ★3 末尾加一个 4 行作业：把官方模板停在 Draft 的 release 自动转正式
#
# 发版流程：改 src-tauri/tauri.conf.json 与 src-tauri/Cargo.toml 的 version
# （两处要一致）→ 合进 main → 完事。版本号没改就推 main 也不会白跑，会跳过。
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 用 universal 单包同时覆盖 Apple Silicon 与 Intel
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          # Linux 产出 deb + rpm + AppImage（tauri.conf.json 的 bundle.targets = all）
          - platform: 'ubuntu-22.04'
            args: ''
          # Windows 产出 NSIS .exe + .msi
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      # 版本号没变就别白跑 7 分钟：已经正式发布过就跳过这一步之后的动作
      - name: 该版本是否已发布
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          HIT=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name==\"v$V\" and .draft==false) | .tag_name")
          if [ -n "$HIT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$V 已经发布过了，本次跳过。发新版本请先改 version"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: setup node
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: install Rust stable
        if: steps.gate.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' && steps.gate.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        if: steps.gate.outputs.skip != 'true'
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        if: steps.gate.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ★2 签名私钥：本地 `npm run tauri signer generate -w ~/.tauri/dsh-launcher.key`
          # 生成，私钥内容进仓库 secret（同名的 _PASSWORD 也要配，空密码就填空串）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'DSH Launcher v__VERSION__'
          releaseBody: 'Windows：.exe / .msi　Linux：.deb / .rpm / .AppImage　macOS：universal .dmg'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # ★3 官方模板到这里就结束了 —— release 停在 Draft，等你去网页点 Publish。
  # 但 releases/latest 只认「非草稿 + 非预发布」，停在草稿或误勾 pre-release
  # 都会让客户端一直「检查不到更新」，所以这里自动转正式。
  # 之所以必须先草稿：三个平台是并发跑的，直接发布会让先跑完的那个把
  # release 发出去，另外两个找不到草稿就去创建 → 422 already_exists，
  # 结果整个平台的产物都缺失。
  publish:
    needs: publish-tauri
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 把草稿发布为正式 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RID=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[] | select(.draft)][0].id // empty')
          if [ -z "$RID" ]; then
            echo "没有草稿可发布（版本号未变时就是这样），结束"
            exit 0
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RID" \
            -F draft=false -F prerelease=false \
            --jq '"已发布 \(.tag_name)  draft=\(.draft)  prerelease=\(.prerelease)"'
