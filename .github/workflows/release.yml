name: 发布

# 官方模板：https://v2.tauri.app/distribute/pipelines/github
# 在原模板上改了四处，代码里都标了 ★：
#   ★1 触发方式：push 到 main（平时在 dev 开发，合进 main 即发版）+ 手动触发
#   ★2 注入签名密钥：否则产物没有 .sig、也不会生成 latest.json
#   ★3 发布说明取自 CHANGELOG.md：本版本段落缺失 / 三处版本号不一致就直接失败；
#      正文会由 tauri-action 写进 latest.json 的 notes → 客户端「发现新版本」直接展示
#   ★4 末尾一个作业：把停在 Draft 的 release 转正式，发布前再按 CHANGELOG 刷一遍正文
#
# 发版流程：CHANGELOG.md 加 ## [新版本号] - 日期 段落（写清用户可见变化）
# → 三处版本号一起改（src-tauri/tauri.conf.json、src-tauri/Cargo.toml、package.json）
# → npm run notes:archive 生成归档快照 → 合进 main → 完事。
# 版本号没改就推 main 也不会白跑：门禁会跳过，不会重复发版。
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 用 universal 单包同时覆盖 Apple Silicon 与 Intel
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          # Linux 产出 deb + rpm + AppImage（tauri.conf.json 的 bundle.targets = all）
          - platform: 'ubuntu-22.04'
            args: ''
          # Windows 产出 NSIS .exe + .msi
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      # 版本号没变就别白跑 7 分钟：已经正式发布过就跳过这一步之后的动作
      - name: 该版本是否已发布
        id: gate
        shell: bash          # Windows runner 默认是 PowerShell，这里必须显式指定
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          HIT=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name==\"v$V\" and .draft==false) | .tag_name")
          if [ -n "$HIT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$V 已经发布过了，本次跳过。发新版本请先改 version"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: setup node
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      # ★3 发布说明门禁 + 提取。CHANGELOG.md 是唯一来源：
      # - 三处版本号不一致 → 失败
      # - 本版本在 CHANGELOG 里没有段落 / 段落里没有任何「- 」条目 → 失败
      # 这样就不会再发出去「Windows：.exe / .msi」这种没有信息量的说明。
      - name: 读取本版本发布说明（CHANGELOG.md）
        id: notes
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          node scripts/release-notes.mjs --check > release-notes.md
          {
            echo 'body<<RELEASE_NOTES_EOF'
            cat release-notes.md
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
          {
            echo "### 本版本发布说明"
            echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: install Rust stable
        if: steps.gate.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # 缓存 Rust 依赖与 target/：这是整个发版最贵的一步 —— 冷缓存下 tauri-action
      # 要现编 500 多个 crate（实测 Windows 620s / Linux 492s，占整作业 90%+）。
      # 三端并行，所以墙钟时间 = 最慢的那个平台。
      # workspaces 必须写成 `src-tauri -> target`：本仓库的 Cargo.toml 在子目录里，
      # 用默认值会找不到 target 目录、缓存等于没开。
      # 注意：GitHub 的缓存 7 天没被访问就会被清掉，发版间隔超过一周时这里可能仍然
      # 是冷启动（.github/workflows 里也别指望它永远命中）。
      - name: 缓存 Rust 构建
        if: steps.gate.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
          # 与 .github/workflows/cache-warm.yml 同名：那个每周作业只恢复、不保存，
          # 专门刷新 GitHub 缓存「7 天不访问即清」的 TTL（本仓库只有真发版才会走到
          # 构建步骤，发版间隔超过一周时缓存必然过期、又回到冷编译）。
          shared-key: tauri-release
          # save-if 保持默认（成功才存），避免存下坏缓存
          cache-on-failure: false

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' && steps.gate.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        if: steps.gate.outputs.skip != 'true'
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        if: steps.gate.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ★2 签名私钥：本地 `npm run tauri signer generate -w ~/.tauri/dsh-starter.key`
          # 生成，私钥内容进仓库 secret（同名的 _PASSWORD 也要配，空密码就填空串）
          # ⚠️ 0.2.0 改名**不要重新生成密钥**：沿用原来那份（旧文件叫 dsh-launcher.key，
          # 改个文件名即可）。换密钥 = 公钥变了 = 已装版本的更新全部验签失败。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'DSH Starter v__VERSION__'
          # ★3 真正的更新说明：与 latest.json 的 notes 同源，客户端直接展示
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # 规范门禁：不碰 Rust/WebKit，几十秒出结果，而且**版本号没变时也会跑**。
  # 作用是把「忘了写 CHANGELOG / 三处版本号不同步 / 前端类型挂了」挡在发版之前，
  # 而不是等 7 分钟的打包跑完才发现。
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: install frontend dependencies
        run: npm ci

      - name: 前端类型检查 + 构建
        run: npm run build

      - name: CHANGELOG 与本版本发布说明
        run: npm run notes:check

  # ★4 官方模板到这里就结束了 —— release 停在 Draft，等你去网页点 Publish。
  # 但 releases/latest 只认「非草稿 + 非预发布」，停在草稿或误勾 pre-release
  # 都会让客户端一直「检查不到更新」，所以这里自动转正式。
  # 之所以必须先草稿：三个平台是并发跑的，直接发布会让先跑完的那个把
  # release 发出去，另外两个找不到草稿就去创建 → 422 already_exists，
  # 结果整个平台的产物都缺失。
  publish:
    needs: [publish-tauri, check]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    # 供 publish-r2 判断「这一轮到底有没有真的发版」：版本号没变时这里什么都没发，
    # 再跑一遍 R2 同步纯属白下载白上传 118MB（还会把手工换过的缓存指纹改回版本号）。
    outputs:
      released: ${{ steps.release.outputs.released }}
    steps:
      - uses: actions/checkout@v7

      # 发布前统一按 CHANGELOG 刷一遍正文：草稿可能由任一平台先创建，
      # 这样 Release 页面与客户端看到的说明一定一致。
      # 草稿的 tag 可能是 tauri-action 生成的占位 `untagged-<sha>`（草稿允许无 tag），
      # 直接转正式会留下没有 git tag 的 release（v0.1.3 就这样踩过，无法按 tag 溯源），
      # 所以发布前先建真实 tag（打在草稿的 target commit 上），再把 release 指过去。
      - name: 刷正文、补 tag 并发布
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RID=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[] | select(.draft)][0].id // empty')
          if [ -z "$RID" ]; then
            echo "没有草稿（版本号未变时就是这样），结束"
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/release-notes.mjs --check > release-notes.md
          RELEASE=$(gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RID" \
            -F body="$(cat release-notes.md)")
          TAG=$(jq -r .tag_name <<<"$RELEASE")
          SHA=$(jq -r .target_commitish <<<"$RELEASE")
          if [[ "$TAG" == untagged-* ]]; then
            REAL="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
            gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$REAL" >/dev/null 2>&1 \
              || gh api repos/"$GITHUB_REPOSITORY"/git/refs \
                   -f ref="refs/tags/$REAL" -f sha="$SHA" >/dev/null
            RELEASE=$(gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RID" -F tag_name="$REAL")
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RID" \
            -F draft=false -F prerelease=false \
            --jq '"已发布 \(.tag_name)  draft=\(.draft)  prerelease=\(.prerelease)"'
          echo "released=true" >> "$GITHUB_OUTPUT"

  # ★5 把发布产物同步到自建更新源（Cloudflare R2）
  #
  # 为什么：客户端默认从 R2 下载更新（代码里写死的基址，见 update_check::R2_BASE）。
  # 实测国内直连（不走代理）拉 81MB 的 AppImage：GitHub release 下载返回 000（连不上），
  # 自建源 200、约 3.3MB/s —— 自建源的价值首先是「能用」，其次才是快。
  #
  # 只在这一轮真的发布了新版本时才跑（版本号没变推 main → publish 是空跑 → 这里也跳过，
  # 不然每次推 main 都要白下载白上传 118MB）。
  # 未配置 R2 secrets 时整个作业自动跳过（打一条 warning），不影响发版。
  # 需要的 secrets（仓库 Settings → Secrets and variables → Actions）：
  #   R2_ACCOUNT_ID        Cloudflare 账号 ID
  #   R2_ACCESS_KEY_ID     R2 API Token 的 Access Key ID
  #   R2_SECRET_ACCESS_KEY R2 API Token 的 Secret Access Key
  publish-r2:
    needs: publish
    runs-on: ubuntu-22.04
    if: github.repository_owner == 'Yinxe' && needs.publish.outputs.released == 'true'
    env:
      # ⚠️ 桶名暂时**保持旧名**：R2 不支持改桶名，新桶 `dsh-starter-release` 建好后，
      # 下面三个值必须一次性同时换（本文件两项 + `update_check.rs` 的 R2_BASE +
      # `site/src/lib/release.ts` 的 R2_BASE）。只换一半是最坏情况：清单传进新桶、客户端
      # 还在读旧桶，而旧桶那份陈旧清单依然「有效」→ 客户端判定「已是最新」，
      # 连 GitHub 兜底都走不到，等于静默卡死更新。步骤见 docs/RELEASING.md 第 1 节。
      R2_BUCKET: dsh-luncher-release
      R2_PUBLIC_BASE: https://pub-65e25af191f546ddb6c2d4fa976345c7.r2.dev
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - uses: actions/checkout@v7

      - name: 是否配置了 R2
        id: cfg
        env:
          R2_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
        run: |
          if [ -n "$R2_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::没有配置 R2_ACCESS_KEY_ID，跳过自建源同步 —— 注意：客户端默认走 R2，R2 清单会停在旧版本，需要手动补传（见 docs/RELEASING.md 第 7 节）"
          fi

      - name: 下载本次发布的产物
        if: steps.cfg.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          mkdir -p r2-upload
          gh release download "$TAG" --dir r2-upload --clobber
          ls -la r2-upload | head -20

      - name: 生成自建源清单（并把下载地址改写到 R2）
        if: steps.cfg.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$TAG" --json assets > r2-upload/assets.json
          node scripts/r2-manifest.mjs \
            --in r2-upload/latest.json \
            --assets-map r2-upload/assets.json \
            --check-dir r2-upload \
            --base "$R2_PUBLIC_BASE" \
            --list-files r2-upload/upload.tsv \
            --out r2-upload/latest.json

      - name: 上传到 R2（固定键覆盖，短缓存）
        if: steps.cfg.outputs.ready == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          # 清单里的地址是固定键（<base>/latest/<平台>.扩展名）+ 版本指纹 ?v=<版本>：
          # 路径对人始终是「latest」，对 CDN 却是每个版本一个新对象 ——
          # 所以对象可以放心用 immutable 长缓存（下载快），也不会下到与签名不符的旧包。
          # 每次发布覆盖同名对象，桶里永远只有一份「当前最新」，不需要清理步骤。
          #
          # 固定键的副作用是「文件名丢了」：人类从直链下载时，浏览器会拿键的最后一段
          # 当保存名，于是拿到的是 windows-x64-setup.exe（没版本、认不出是谁的包）。
          # 所以每个对象都要带上 Content-Disposition —— 第三个字段就是脚本算好的
          # 「attachment; filename="原始资产名"」。更新器不看这个头（它按文件头魔数
          # 判类型、自己拼临时文件名），这个头纯粹是给人看的。
          while IFS=$'\t' read -r local key disposition; do
            [ -z "$local" ] && continue
            echo "→ latest/$key   (← $local, 下载名 $local)"
            aws s3 cp "r2-upload/$local" "s3://$R2_BUCKET/latest/$key" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type application/octet-stream \
              --content-disposition "$disposition" \
              --cache-control "public, max-age=31536000, immutable" \
              --no-progress
          done < r2-upload/upload.tsv
          # 清单本身同样必须不缓存：否则客户端会长期看到旧清单（更新提示不出现）
          aws s3 cp r2-upload/latest.json "s3://$R2_BUCKET/latest.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type application/json \
            --cache-control "no-cache, max-age=0" \
            --no-progress
          echo "--- 桶内容（应只有 latest.json + latest/ 下的固定键）---"
          aws s3 ls "s3://$R2_BUCKET/" --endpoint-url "$R2_ENDPOINT"
          aws s3 ls "s3://$R2_BUCKET/latest/" --endpoint-url "$R2_ENDPOINT"

      - name: 自检（公网地址能取到清单、指向 R2、且下载文件名没丢）
        if: steps.cfg.outputs.ready == 'true'
        run: |
          curl -fsS --max-time 30 "$R2_PUBLIC_BASE/latest.json" -o /tmp/r2-latest.json
          node -e '
            (async () => {
              const fs = require("fs");
              const m = JSON.parse(fs.readFileSync("/tmp/r2-latest.json", "utf8"));
              const base = process.env.R2_PUBLIC_BASE;
              const platforms = Object.entries(m.platforms ?? {});
              if (!platforms.length) throw new Error("清单里没有平台键");
              // upload.tsv: 本地文件名 <TAB> R2 键 <TAB> Content-Disposition
              const tsv = fs.readFileSync("r2-upload/upload.tsv", "utf8").trim().split("\n");
              const wantName = new Map(tsv.map((line) => {
                const [local, key] = line.split("\t");
                return [key, local];
              }));
              const byUrl = new Map();
              for (const [k, v] of platforms) {
                if (!v.url.startsWith(base + "/latest/")) throw new Error(`${k} 的地址不是固定键: ${v.url}`);
                byUrl.set(v.url, decodeURIComponent(v.url.split("?")[0].split("/").pop()));
              }
              for (const [url, key] of byUrl) {
                const res = await fetch(url, { method: "HEAD" });
                if (!res.ok) throw new Error(`${url} → HTTP ${res.status}`);
                const cd = res.headers.get("content-disposition") ?? "";
                const name = wantName.get(key) ?? key;
                if (!cd.includes(`filename="${name}"`)) {
                  throw new Error(`${key} 的 Content-Disposition 里没有原始文件名 ${name}（实际: ${cd || "缺失"})`);
                }
              }
              console.log(`✔ 自建源清单 version=${m.version}，${platforms.length} 个平台键全部指向 ${base}`);
              console.log(`✔ ${byUrl.size} 个对象都能取到，且下载文件名保留原始资产名`);
            })().catch((e) => { console.error(`✖ 自检失败：${e.message}`); process.exit(1); });
          '
