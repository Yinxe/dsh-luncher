name: Release 打包

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（例如 0.2.0）'
        required: true
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04 # deb + AppImage
            args: ''
          - platform: windows-latest # NSIS 安装包（.exe）
            args: ''
          - platform: macos-latest # universal dmg（Intel + Apple Silicon）
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust 编译缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: 写入版本号
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const v = process.env.VERSION;
            if (!/^\d+\.\d+\.\d+(-[\w.]+)?$/.test(v)) {
              console.error('无效的版本号: ' + v + '，需要形如 1.2.3 或 1.2.3-beta.1');
              process.exit(1);
            }
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = v;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            conf.version = v;
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
            const cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
            fs.writeFileSync('src-tauri/Cargo.toml', cargo.replace(/^version = \".*\"/m, 'version = \"' + v + '\"'));
            console.log('版本已设置为 ' + v);
          "

      - name: 安装前端依赖
        run: npm ci

      - name: 打包并上传到 Draft Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'DSH Launcher v__VERSION__'
          releaseBody: '跨平台安装包，请从下方 Assets 下载：Linux（deb / AppImage）、Windows（NSIS 安装包）、macOS（universal dmg）。'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
