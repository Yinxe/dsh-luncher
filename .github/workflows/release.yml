name: Release 打包

# 基于 Tauri 官方模板：https://v2.tauri.app/distribute/pipelines/github
# 构建与发布交给 tauri-apps/tauri-action@v1 —— 它自己读 tauri.conf.json 的
# version、替换 __VERSION__、创建 Draft Release 并上传产物；末尾再补一个
# normalize-updater-json 作业把 latest.json 的下载地址改写成 canonical 形式。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（留空则用 tauri.conf.json 中的版本）'
        required: false
        type: string
  push:
    branches:
      - release

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 用 universal 单包同时覆盖 Apple Silicon 与 Intel（官方示例之一）
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          # Linux：deb + rpm + AppImage（由 tauri.conf.json 的 bundle.targets = all 决定）
          - platform: 'ubuntu-22.04'
            args: ''
          # Windows：NSIS .exe + .msi
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # 交叉目标只有 macOS 需要，其他平台留空以省编译时间
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust 编译缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 安装前端依赖
        run: npm ci

      # 可选版本号：填了就通过官方 `tauri build --config` 覆盖（不修改任何文件），
      # 留空则由 tauri-action 从 tauri.conf.json 读取。config_arg 会同时进入
      # tauri-action 的版本解析（决定 __VERSION__）和 tauri build 的实际参数。
      - name: 解析版本号
        id: ver
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$INPUT_VERSION" ]; then
            echo "未填版本号，使用 tauri.conf.json 中的版本"
            echo "config_arg=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node -e '
            const v = process.env.INPUT_VERSION;
            if (!/^\d+\.\d+\.\d+(-[\w.]+)?(\+[\w.]+)?$/.test(v)) {
              console.error("无效的版本号: " + v + "，需要形如 1.2.3 或 1.2.3-beta.1");
              process.exit(1);
            }
          '
          echo "config_arg=--config '{\"version\":\"$INPUT_VERSION\"}'" >> "$GITHUB_OUTPUT"
          echo "本次发布版本: $INPUT_VERSION"

      - name: 打包并上传到 Draft Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # updater 签名私钥：在本地 `npm run tauri signer generate -w ~/.tauri/dsh-launcher.key`
          # 生成后把私钥文件内容整段贴进仓库 secret；钥匙串留空就再配一个空密码 secret。
          # 两个 secret 缺任意一个，产物都不会带 .sig，也不会生成 latest.json。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__ # action 自动把 __VERSION__ 替换为应用版本号
          releaseName: 'DSH Launcher v__VERSION__'
          releaseBody: '跨平台安装包，请从下方 Assets 下载：Linux（.deb / .rpm / .AppImage）、Windows（NSIS .exe 安装包 / .msi）、macOS（universal .dmg）。'
          releaseDraft: true
          prerelease: false
          # 生成 updater 清单 latest.json 并上传到同一个 Release —— 应用内自动更新的数据源。
          # 注意输入名：v1 是 uploadUpdaterJson（v0 那版叫 includeUpdaterJson，写错会被静默忽略）
          uploadUpdaterJson: true
          args: ${{ matrix.args }} ${{ steps.ver.outputs.config_arg }}

  # tauri-action 写进 latest.json 的下载地址是
  # `https://api.github.com/repos/<owner>/<repo>/releases/assets/<id>` —— 这种形式
  # 只有部分 GitHub 加速前端认（实测 gh-proxy 可以，ghfast.top 直接 403）。
  # 这里统一改写成 `https://github.com/<repo>/releases/download/<tag>/<asset>`，
  # 所有代理都支持，而且点开就是浏览器能直接下载的地址。
  normalize-updater-json:
    needs: publish-tauri
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: 把 latest.json 的下载地址改写成 canonical 形式
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION:-$(node -p "require('./src-tauri/tauri.conf.json').version")}"
          TAG="v$VERSION"
          API="repos/$GITHUB_REPOSITORY"
          echo "目标 Release: $TAG"

          RID=$(gh api "$API/releases/tags/$TAG" --jq .id)
          gh api "$API/releases/$RID/assets?per_page=100" \
            --jq '.[] | "\(.id)\t\(.name)"' > /tmp/assets.tsv
          LID=$(awk -F'\t' '$2=="latest.json"{print $1}' /tmp/assets.tsv)
          if [ -z "$LID" ]; then
            echo "::error::Release $TAG 里没有 latest.json，无法改写"
            exit 1
          fi

          gh api "$API/releases/assets/$LID" \
            -H "Accept: application/octet-stream" > /tmp/latest.json

          python3 - "$GITHUB_REPOSITORY" "$TAG" <<'PY'
          import json, sys
          repo, tag = sys.argv[1], sys.argv[2]
          assets = {}
          for line in open("/tmp/assets.tsv"):
              line = line.rstrip("\n")
              if not line:
                  continue
              aid, _, name = line.partition("\t")
              assets[aid] = name
          with open("/tmp/latest.json") as f:
              j = json.load(f)
          n = 0
          for p in j.get("platforms", {}).values():
              url = p.get("url", "")
              if "/releases/assets/" in url:
                  aid = url.rsplit("/releases/assets/", 1)[1]
                  if aid in assets:
                      p["url"] = f"https://github.com/{repo}/releases/download/{tag}/{assets[aid]}"
                      n += 1
          with open("/tmp/latest.json", "w") as f:
              json.dump(j, f, ensure_ascii=False, indent=2)
          print(f"改写了 {n} 条平台地址")
          PY

          # --clobber：同名资产先删后传，避免中途失败把 latest.json 弄丢
          gh release upload "$TAG" /tmp/latest.json --clobber
          echo "完成，latest.json 现在是 canonical 地址"
