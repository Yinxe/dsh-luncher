name: Release 打包

# 基于 Tauri 官方模板：https://v2.tauri.app/distribute/pipelines/github
# 构建与发布全部交给 tauri-apps/tauri-action@v1 —— 它自己读 tauri.conf.json 的
# version、替换 __VERSION__、创建 Draft Release 并上传产物，无需任何自定义脚本。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（留空则用 tauri.conf.json 中的版本）'
        required: false
        type: string
  push:
    branches:
      - release

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 用 universal 单包同时覆盖 Apple Silicon 与 Intel（官方示例之一）
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          # Linux：deb + rpm + AppImage（由 tauri.conf.json 的 bundle.targets = all 决定）
          - platform: 'ubuntu-22.04'
            args: ''
          # Windows：NSIS .exe + .msi
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # 交叉目标只有 macOS 需要，其他平台留空以省编译时间
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust 编译缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 安装前端依赖
        run: npm ci

      # 可选版本号：填了就通过官方 `tauri build --config` 覆盖（不修改任何文件），
      # 留空则由 tauri-action 从 tauri.conf.json 读取。config_arg 会同时进入
      # tauri-action 的版本解析（决定 __VERSION__）和 tauri build 的实际参数。
      - name: 解析版本号
        id: ver
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$INPUT_VERSION" ]; then
            echo "未填版本号，使用 tauri.conf.json 中的版本"
            echo "config_arg=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node -e '
            const v = process.env.INPUT_VERSION;
            if (!/^\d+\.\d+\.\d+(-[\w.]+)?(\+[\w.]+)?$/.test(v)) {
              console.error("无效的版本号: " + v + "，需要形如 1.2.3 或 1.2.3-beta.1");
              process.exit(1);
            }
          '
          echo "config_arg=--config '{\"version\":\"$INPUT_VERSION\"}'" >> "$GITHUB_OUTPUT"
          echo "本次发布版本: $INPUT_VERSION"

      - name: 打包并上传到 Draft Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # updater 签名私钥：在本地 `npm run tauri signer generate -w ~/.tauri/dsh-launcher.key`
          # 生成后把私钥文件内容整段贴进仓库 secret；钥匙串留空就再配一个空密码 secret。
          # 两个 secret 缺任意一个，产物都不会带 .sig，也不会生成 latest.json。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__ # action 自动把 __VERSION__ 替换为应用版本号
          releaseName: 'DSH Launcher v__VERSION__'
          releaseBody: '跨平台安装包，请从下方 Assets 下载：Linux（.deb / .rpm / .AppImage）、Windows（NSIS .exe 安装包 / .msi）、macOS（universal .dmg）。'
          releaseDraft: true
          prerelease: false
          # 生成 updater 清单 latest.json 并上传到同一个 Release —— 应用内自动更新的数据源
          includeUpdaterJson: true
          args: ${{ matrix.args }} ${{ steps.ver.outputs.config_arg }}
