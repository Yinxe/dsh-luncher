name: 发布

# 官方模板：https://v2.tauri.app/distribute/pipelines/github
# 在原模板上改了五处，代码里都标了 ★：
#   ★1 触发方式：push 到 main（平时在 dev 开发，合进 main 即发版）+ 手动触发
#   ★2 注入签名密钥：否则产物没有 .sig、也不会生成 latest.json
#   ★3 发布说明取自 CHANGELOG.md：本版本段落缺失 / 三处版本号不一致就直接失败；
#      正文会由 tauri-action 写进 latest.json 的 notes → 客户端「发现新版本」直接展示
#   ★4 末尾一个作业：把停在 Draft 的 release 转正式，发布前再按 CHANGELOG 刷一遍正文
#   ★5 发布逻辑全部抽进 scripts/*.mjs（release-gate / publish-release / sync-r2 / verify-r2），
#      本文件只留「装环境 + 调脚本 + aws 上传」。踩过的坑都写在脚本头部注释里：
#      releases/tags 接口的滞后读副本会吞资产（gh release download 因此连挂两轮），
#      脚本一律按 release id 走 /releases/<id>/assets 专用端点。
#
# 发版流程：CHANGELOG.md 加 ## [新版本号] - 日期 段落（写清用户可见变化）
# → 三处版本号一起改（src-tauri/tauri.conf.json、src-tauri/Cargo.toml、package.json）
# → npm run notes:archive 生成归档快照 → 合进 main → 完事。
# 版本号没改就推 main 也不会白跑：门禁会跳过，不会重复发版。
#
# 手动触发带 force_r2=true：不重新打包，认领**已发布**的 v<当前版本> 只做 R2 全量补传
# （GitHub 发好了但 R2 停在旧版时用，替代 docs/RELEASING.md 第 7 节的手工流程）。
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_r2:
        description: 只补 R2 同步（不重新打包/发布，要求当前版本已正式发布）
        type: boolean
        default: false

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 用 universal 单包同时覆盖 Apple Silicon 与 Intel
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          # Linux 产出 deb + rpm + AppImage（tauri.conf.json 的 bundle.targets = all）
          - platform: 'ubuntu-22.04'
            args: ''
          # Windows 产出 NSIS .exe + .msi
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      # 版本号没变（或 force_r2 纯补传）就别白跑 7 分钟打包：门禁直接 skip
      - name: 该版本是否已发布
        id: gate
        shell: bash          # Windows runner 默认是 PowerShell，这里必须显式指定
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_R2: ${{ inputs.force_r2 }}
        run: node scripts/release-gate.mjs

      - name: setup node
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      # ★3 发布说明门禁 + 提取（详见 scripts/release-notes.mjs）：
      # 三处版本号不一致 / 本版本在 CHANGELOG 没段落 / 段落没有「- 」条目 → 直接失败
      - name: 读取本版本发布说明（CHANGELOG.md）
        id: notes
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          node scripts/release-notes.mjs --check > release-notes.md
          {
            echo 'body<<RELEASE_NOTES_EOF'
            cat release-notes.md
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
          {
            echo "### 本版本发布说明"
            echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: install Rust stable
        if: steps.gate.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # 缓存 Rust 依赖与 target/：这是整个发版最贵的一步 —— 冷缓存下 tauri-action
      # 要现编 500 多个 crate（实测 Windows 620s / Linux 492s，占整作业 90%+）。
      # workspaces 必须写成 `src-tauri -> target`：本仓库的 Cargo.toml 在子目录里，
      # 用默认值会找不到 target 目录、缓存等于没开。
      # GitHub 的缓存 7 天没被访问就会被清掉，发版间隔超过一周时这里可能仍是冷启动
      #（配套的 cache-warm.yml 每周作业专门刷新这份缓存的 TTL）。
      - name: 缓存 Rust 构建
        if: steps.gate.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
          shared-key: tauri-release
          # save-if 保持默认（成功才存），避免存下坏缓存
          cache-on-failure: false

      # AppImage 打包要用的 5 个工具（约 36MB），tauri-bundler「文件不存在才下载」，
      # 默认位置 ~/.cache/tauri。为什么独立成一份缓存（不放 target/.tauri、
      # 不放 rust-cache 的 cache-directories）见 git 历史里这段的长注释。
      - name: 缓存 Tauri 打包工具（AppImage，仅 Linux）
        if: matrix.platform == 'ubuntu-22.04' && steps.gate.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/tauri
          key: tauri-tools-linux-v1

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' && steps.gate.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        if: steps.gate.outputs.skip != 'true'
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        if: steps.gate.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ★2 签名私钥：本地 `npm run tauri signer generate -w ~/.tauri/dsh-starter.key`
          # 生成，私钥内容进仓库 secret（同名的 _PASSWORD 也要配，空密码就填空串）
          # ⚠️ 0.2.0 改名**不要重新生成密钥**：沿用原来那份（旧文件叫 dsh-launcher.key，
          # 改个文件名即可）。换密钥 = 公钥变了 = 已装版本的更新全部验签失败。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'DSH Starter v__VERSION__'
          # ★3 真正的更新说明：与 latest.json 的 notes 同源，客户端直接展示
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # 规范门禁：不碰 Rust/WebKit，几十秒出结果，而且**版本号没变时也会跑**。
  # 作用是把「忘了写 CHANGELOG / 三处版本号不同步 / 前端类型挂了」挡在发版之前，
  # 而不是等 7 分钟的打包跑完才发现。
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: install frontend dependencies
        run: npm ci

      - name: 前端类型检查 + 构建
        run: npm run build

      - name: CHANGELOG 与本版本发布说明
        run: npm run notes:check

  # ★4 官方模板到这里就结束了 —— release 停在 Draft，等你去网页点 Publish。
  # 但 releases/latest 只认「非草稿 + 非预发布」，停在草稿或误勾 pre-release
  # 都会让客户端一直「检查不到更新」，所以这里自动转正式。
  # 之所以必须先草稿：三个平台是并发跑的，直接发布会让先跑完的那个把
  # release 发出去，另外两个找不到草稿就去创建 → 422 already_exists。
  #
  # 全部判断逻辑在 scripts/publish-release.mjs（为何按 id 读资产、如何认领草稿、
  # 为何转正式前先建 git tag —— 注释都在脚本头部）。它把 releaseId 输出给
  # publish-r2，让下游完全不碰滞后的 tag 接口。
  publish:
    needs: [publish-tauri, check]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    # released：这一轮到底有没有真的发版（force_r2 时是「认领已发布」）；
    # releaseId：publish-r2 读资产的唯一凭据。版本号没变时 released=false，下游全跳过。
    outputs:
      released: ${{ steps.release.outputs.released }}
      releaseId: ${{ steps.release.outputs.releaseId }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: 刷正文、补 tag 并发布
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/publish-release.mjs \
            ${{ inputs.force_r2 == true && '--adopt-published' || '' }}

  # ★5 把发布产物同步到自建更新源（Cloudflare R2）
  #
  # 为什么：客户端默认从 R2 下载更新（代码里写死的基址，见 update_check::R2_BASE）。
  # 实测国内直连（不走代理）拉 81MB 的 AppImage：GitHub release 下载返回 000（连不上），
  # 自建源 200、约 3.3MB/s —— 自建源的价值首先是「能用」，其次才是快。
  #
  # 同步范围（0.3.1 起）：**GitHub Release 的全部资产 1:1 镜像**到
  #   releases/v<版本>/<原文件名>（长缓存），外加更新器/下载页要的固定键
  #   latest/<稳定键>?v=<版本> 与桶根 latest.json（no-cache）。
  #
  # 只在这一轮真的发布了新版本（或 force_r2）时才跑；未配置 R2 secrets 时整个作业
  # 自动跳过（打一条 warning），不影响发版。需要的 secrets：
  #   R2_ACCOUNT_ID / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY（见 docs/RELEASING.md 第 1 节）
  publish-r2:
    needs: publish
    runs-on: ubuntu-22.04
    if: github.repository_owner == 'Yinxe' && needs.publish.outputs.released == 'true'
    env:
      # ⚠️ 下面四个值必须**同进同退**：本文件的 R2_BUCKET / R2_PUBLIC_BASE、
      # `src-tauri/src/update_check.rs` 的 R2_BASE、`site/src/lib/release.ts` 的 R2_BASE。
      # 只换一半是最坏情况：清单传进新桶、客户端仍在读旧桶，而旧桶那份陈旧清单依然「有效」
      # → 客户端判定「已是最新」，连 GitHub 兜底都走不到，等于静默卡死更新。
      # 另：CI 用的 R2 API Token 必须把桶加进 Scope，否则上传 403。
      R2_BUCKET: dsh-starter-release
      R2_PUBLIC_BASE: https://pub-576ca711d9cf4cfe96b58195dfe6ce81.r2.dev
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: 是否配置了 R2
        id: cfg
        env:
          R2_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
        run: |
          if [ -n "$R2_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::没有配置 R2_ACCESS_KEY_ID，跳过自建源同步 —— 注意：客户端默认走 R2，R2 清单会停在旧版本，需要手动补传（见 docs/RELEASING.md 第 7 节）"
          fi

      # 拉**全部**资产 + 改写清单 + 生成完整上传清单（对象键已含 latest/ 与 releases/ 前缀）。
      # 按 publish 给的 releaseId 读资产，从根上绕开 gh release download 的滞后副本坑。
      - name: 拉取产物并生成上传清单
        if: steps.cfg.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish.outputs.tag }}
        run: |
          node scripts/sync-r2.mjs \
            --dir r2-upload \
            --version "${VERSION#v}" \
            --release-id "${{ needs.publish.outputs.releaseId }}"
          ls -la r2-upload | head -20

      - name: 上传到 R2（固定键覆盖 + 全资产镜像，长缓存）
        if: steps.cfg.outputs.ready == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          # 两类对象键（upload.tsv 第 2 列，都是完整路径）：
          # - latest/<稳定键>?… 更新器读的固定键：路径不带版本号、每次发布覆盖同名对象，
          #   清单里的 ?v=<版本> 是缓存指纹 —— 对象可 immutable 长缓存，也不会下到与
          #   签名不符的旧包；Content-Disposition 把「固定键丢了文件名」补回来
          #   （人类直链下载拿到的还是 DSH.Starter_0.3.1_… 而不是 windows-x64-setup.exe）。
          # - releases/v<版本>/<原文件名> GitHub 资产的完整镜像：文件名天然带版本，
          #   不需要 disposition（tsv 里是 "-"），断 GitHub 时按原名直取。
          # 桶里 latest/ 永远只有一份「当前最新」；releases/ 每个版本一份，不需要清理步骤。
          while IFS=$'\t' read -r local key cd; do
            [ -z "$local" ] && continue
            extra=()
            [ "$cd" != "-" ] && extra+=(--content-disposition "$cd")
            echo "→ $key   (← $local)"
            aws s3 cp "r2-upload/$local" "s3://$R2_BUCKET/$key" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type application/octet-stream \
              "${extra[@]}" \
              --cache-control "public, max-age=31536000, immutable" \
              --no-progress
          done < r2-upload/upload.tsv
          # 清单本身同样必须不缓存：否则客户端会长期看到旧清单（更新提示不出现）
          aws s3 cp r2-upload/latest.json "s3://$R2_BUCKET/latest.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type application/json \
            --cache-control "no-cache, max-age=0" \
            --no-progress
          echo "--- 桶内容（latest.json + latest/ 固定键 + releases/v*/ 镜像）---"
          aws s3 ls "s3://$R2_BUCKET/" --endpoint-url "$R2_ENDPOINT"
          aws s3 ls "s3://$R2_BUCKET/latest/" --endpoint-url "$R2_ENDPOINT"
          aws s3 ls "s3://$R2_BUCKET/releases/" --endpoint-url "$R2_ENDPOINT"

      - name: 自检（清单版本与地址、全部对象公网可取、下载文件名没丢）
        if: steps.cfg.outputs.ready == 'true'
        run: node scripts/verify-r2.mjs --dir r2-upload --version "${{ needs.publish.outputs.tag }}"
