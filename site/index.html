    <link rel="preconnect" href="https://api.github.com" crossorigin />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DSH Starter — DeepSeek Harness 的跨平台图形启动器" />
    <meta
      property="og:description"
      content="把 dsh 的版本、实例、插件和模型配置收进一个窗口。Windows / macOS / Linux 安装包直链，自建源与 GitHub 源可选。"
    />
    <script>
      /*
       * 首帧前定主题，避免「先暗后亮」的闪光。
       * 规则：**默认亮色**；只有用户手动切过暗色才用暗色（存的是 dsh-site:theme）。
       * 必须内联且同步执行 —— 放到 React 里就晚了。
       */
      (function () {
        var root = document.documentElement;
        var dark = false;
        try {
          dark = localStorage.getItem("dsh-site:theme") === "dark";
        } catch (e) {
          dark = false;
        }
        root.classList.toggle("dark", dark);
        root.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 24px; font: 14px/1.7 system-ui, sans-serif">
        <h1>DSH Starter</h1>
        <p>本页需要 JavaScript 才能读取最新版本号并生成下载直链。也可以直接去发布页手工下载：</p>

          </li>

      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
